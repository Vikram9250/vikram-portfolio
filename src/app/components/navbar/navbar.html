                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all shadow-md shadow-blue-600/20">

        </div>

        <button type="button" class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg text-slate-700 hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"
            [attr.aria-expanded]="menuOpen" aria-controls="mobile-navigation"
            [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
            (click)="menuOpen = !menuOpen">
            <svg *ngIf="!menuOpen" aria-hidden="true" viewBox="0 0 24 24" class="w-6 h-6 fill-none stroke-current" stroke-width="2" stroke-linecap="round">
                <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <svg *ngIf="menuOpen" aria-hidden="true" viewBox="0 0 24 24" class="w-6 h-6 fill-none stroke-current" stroke-width="2" stroke-linecap="round">
                <path d="m6 6 12 12M18 6 6 18" />
            </svg>
        </button>
    </div>

    <nav *ngIf="menuOpen" id="mobile-navigation" class="md:hidden border-t border-slate-200 bg-white px-4 py-3 shadow-lg">

        <div class="flex items-center gap-5 px-3 pt-3 mt-2 border-t border-slate-100">
            <a href="https://github.com/Vikram9250" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" class="text-slate-500 hover:text-slate-900">
